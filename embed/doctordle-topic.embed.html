<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<!-- Privacy-friendly analytics by Plausible -->
	<script async src="https://analytics.shudushaole.xyz/js/pa-VoALqv6K08dDuxygSd-91.js"></script>
	<script>
		window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
		plausible.init();
	</script>
	<title>Doctordle Topic Mode</title>
	<meta name="robots" content="noindex, nofollow" />
	<link rel="stylesheet" href="/css/style.css" />
	<link rel="stylesheet" href="/css/topic-ui.css" />
</head>
<body class="topic-shell">
<main>
	<section class="topic-hub" id="topic-hub">
		<div class="topic-heading">
			<div class="topic-symbol" aria-hidden="true"><svg viewBox="0 0 32 32" width="28" height="28" fill="none"><path d="M3 17h6l3-9 6 17 3-8h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
			<div><p class="topic-brief__kicker" id="topic-kicker">SPECIALTY PRACTICE</p><h1 id="topic-title">Emergency Medicine</h1></div>
			<div class="topic-heading-actions">
				<button class="topic-stats-btn topic-back-btn" id="topic-back" type="button" aria-label="Back to mode selection" title="Back to mode selection"><svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M20 12H4m6-6-6 6 6 6" /></svg><span>Modes</span></button>
				<button class="topic-stats-btn" id="topic-stats-open" type="button" aria-controls="topic-stats-panel" aria-expanded="false"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/images/ui-icons.svg#chart" /></svg><span>Your stats</span></button>
				<span id="topic-sound-controls"></span>
			</div>
		</div>
		<p class="topic-brief__copy" id="topic-copy">Choose how you want to play.</p>
		<div class="topic-toolbar">
			<div class="topic-mode-switch" aria-label="Game mode">
				<button id="mode-daily" type="button" aria-pressed="false"><span class="mode-choice__icon" aria-hidden="true"><svg class="ui-icon"><use href="/images/ui-icons.svg#daily" /></svg></span><span class="mode-choice__title">Daily case <svg class="ui-icon" aria-hidden="true"><use href="/images/ui-icons.svg#arrow" /></svg></span><span class="mode-choice__description">One case each day. Six guesses to solve it.</span><span class="mode-choice__meta"><span id="daily-case-value">Today's case</span><span class="topic-clock__reset">Next daily case in <strong id="daily-reset-value" aria-live="off">00:00:00</strong></span></span><span class="mode-choice__action">Play daily <span aria-hidden="true">→</span></span></button>
				<button id="mode-challenge" type="button" aria-pressed="false"><span class="mode-choice__icon" aria-hidden="true"><svg class="ui-icon"><use href="/images/ui-icons.svg#infinity" /></svg></span><span class="mode-choice__title">Unlimited <svg class="ui-icon" aria-hidden="true"><use href="/images/ui-icons.svg#arrow" /></svg></span><span class="mode-choice__description">Keep playing specialty cases in Challenge mode.</span><span class="mode-choice__meta"><span>No daily limit</span><span class="mode-choice__note">A new case whenever you're ready.</span></span><span class="mode-choice__action">Play unlimited <span aria-hidden="true">→</span></span></button>
			</div>
		</div>
	</section>
	<section class="topic-game-shell" id="topic-game-shell" hidden>
		<iframe class="topic-game-frame" id="topic-game-frame" loading="eager" referrerpolicy="same-origin"></iframe>
	</section>

<section class="topic-stats-panel" id="topic-stats-panel" aria-labelledby="topic-stats-title" hidden>
	<div class="topic-stats-box">
		<div class="topic-stats-box__top">
			<div>
				<h2 id="topic-stats-title"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/images/ui-icons.svg#chart" /></svg> Your progress</h2>
				<p id="topic-stats-copy">Your daily and unlimited results for this specialty.</p>
			</div>
			<button class="topic-stats-close" id="topic-stats-close" type="button">Hide</button>
		</div>
		<div class="topic-stats-grid">
			<section class="topic-stats-card">
				<h3>Daily</h3>
				<div class="topic-stats-row">
					<div class="topic-stats-pill"><span class="topic-stats-pill__label">Played</span><span class="topic-stats-pill__value" id="daily-stats-played">0</span></div>
					<div class="topic-stats-pill"><span class="topic-stats-pill__label">Win Rate</span><span class="topic-stats-pill__value" id="daily-stats-winrate">0%</span></div>
					<div class="topic-stats-pill"><span class="topic-stats-pill__label">Current Streak</span><span class="topic-stats-pill__value" id="daily-stats-current">0</span></div>
					<div class="topic-stats-pill"><span class="topic-stats-pill__label">Best Streak</span><span class="topic-stats-pill__value" id="daily-stats-best">0</span></div>
				</div>
				<div class="guess-chart" id="daily-distribution"></div>
			</section>
			<section class="topic-stats-card">
				<h3>Unlimited · Challenge</h3>
				<div class="topic-stats-row">
					<div class="topic-stats-pill"><span class="topic-stats-pill__label">Played</span><span class="topic-stats-pill__value" id="challenge-stats-played">0</span></div>
					<div class="topic-stats-pill"><span class="topic-stats-pill__label">Win Rate</span><span class="topic-stats-pill__value" id="challenge-stats-winrate">0%</span></div>
					<div class="topic-stats-pill"><span class="topic-stats-pill__label">Current Streak</span><span class="topic-stats-pill__value" id="challenge-stats-current">0</span></div>
					<div class="topic-stats-pill"><span class="topic-stats-pill__label">Best Streak</span><span class="topic-stats-pill__value" id="challenge-stats-best">0</span></div>
				</div>
				<div class="guess-chart" id="challenge-distribution"></div>
			</section>
		</div>
	</div>
</section>
</main>

<script src="/js/topic-config.js"></script>
<script type="module" src="/js/topic-hub.js"></script>
</body>
</html>
